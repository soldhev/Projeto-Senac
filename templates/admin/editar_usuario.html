<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Senac Tech - Editar Usuário</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="../../static/css/global/variables.css">
		<link rel="stylesheet" type="text/css" href="../../static/css/home/body.css">
		<link rel="stylesheet" type="text/css" href="../../static/css/global/menu.css">
		<link rel="stylesheet" type="text/css" href="../../static/css/global/footer.css">
		<link rel="stylesheet" type="text/css" href="../../static/css/admin/admin.css">
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	</head>
	<body>
		<header class="site-header">
			<div class="header-container">
				<img src="../../static/imagens/logo/logosenac.png" alt="Logo Senac" title="Senac" id="logosenac">

				<input type="checkbox" id="bt_menu">
				<label for="bt_menu">&#9776;</label>

				<nav id="menu">
					<ul>
						<li>
							<a href="../../home/index.html">Início</a>
						</li>
						<li>
							<a href="../painel.html">Painel Admin</a>
						</li>
					</ul>
				</nav>

				<div class="header-actions">
					<a href="../../login/logout" class="btn btn-entrar">Sair</a>
				</div>
			</div>
		</header>

		<main class="admin-main">
			<h2>Editar Usuário</h2>
			<a href="../painel.html" class="admin-voltar">&larr; Voltar para o painel</a>
			<a href="../novo_usuario.html" class="admin-voltar admin-voltar-direita">+ Cadastrar novo usuário</a>

			{% if erro %}
				<div class="login-mensagem login-erro">{{ erro }}</div>
			{% endif %}

			<form action="" method="post" class="admin-form form-valida-senha">
				<div class="admin-form-linha">
					<div>
						<label for="nome">Nome</label>
						<input type="text" id="nome" name="nome" value="{{ usuario['nome'] }}" required>
					</div>
					<div>
						<label for="sobrenome">Sobrenome</label>
						<input type="text" id="sobrenome" name="sobrenome" value="{{ usuario['sobrenome'] }}" required>
					</div>
				</div>

				<div class="admin-form-linha">
					<div>
						<label for="email">E-mail</label>
						<input type="email" id="email" name="email" value="{{ usuario['email'] }}" required>
					</div>
					<div>
						<label for="usuario">Usuário</label>
						<input type="text" id="usuario" name="usuario" value="{{ usuario['usuario'] }}" required>
					</div>
				</div>

				<div class="admin-form-linha">
					<div>
						<label for="endereco">Endereço</label>
						<input type="text" id="endereco" name="endereco" value="{{ usuario['endereco'] }}">
					</div>
					<div>
						<label for="numero">Número</label>
						<input type="text" id="numero" name="numero" value="{{ usuario['numero'] }}">
					</div>
				</div>

				<div class="admin-form-linha">
					<div>
						<label for="bairro">Bairro</label>
						<input type="text" id="bairro" name="bairro" value="{{ usuario['bairro'] }}">
					</div>
					<div>
						<label for="cidade">Cidade</label>
						<input type="text" id="cidade" name="cidade" value="{{ usuario['cidade'] }}">
					</div>
					<div>
						<label for="estado">Estado (UF)</label>
						<input type="text" id="estado" name="estado" value="{{ usuario['estado'] }}" maxlength="2">
					</div>
				</div>

				<div class="admin-form-linha">
					<div>
						<label for="cpf">CPF</label>
						<input type="text" id="cpf" name="cpf" value="{{ usuario['cpf'] }}">
					</div>
					<div>
						<label for="rg">RG</label>
						<input type="text" id="rg" name="rg" value="{{ usuario['rg'] }}">
					</div>
					<div>
						<label for="data_nascimento">Data de Nascimento</label>
						<input type="date" id="data_nascimento" name="data_nascimento" value="{{ usuario['data_nascimento'] }}">
					</div>
				</div>

				<div class="admin-form-linha">
					<div>
						<label for="celular">Celular</label>
						<input type="tel" id="celular" name="celular" value="{{ usuario['celular'] }}">
					</div>
					<div class="admin-checkbox-linha">
						<label for="admin">
							<input type="checkbox" id="admin" name="admin" {{ "checked" if usuario["admin"] else "" }}>
							Este usuário é administrador
						</label>
					</div>
				</div>

				<label for="observacao">Observação</label>
				<textarea id="observacao" name="observacao" rows="3">{{ usuario['observacao'] or "" }}</textarea>

				<h3 class="admin-form-subtitulo">Redefinir Senha (opcional)</h3>
				<p class="admin-form-ajuda">Deixe os campos abaixo em branco para manter a senha atual do usuário.</p>

				<div class="admin-form-linha">
					<div>
						<label for="nova_senha">Nova senha</label>
						<input type="password" id="nova_senha" name="nova_senha">
					</div>
					<div>
						<label for="confirmar_nova_senha">Confirmar nova senha</label>
						<input type="password" id="confirmar_nova_senha" name="confirmar_nova_senha">
					</div>
				</div>

				<button type="submit" class="btn-entrar-form">Salvar alterações</button>
			</form>
		</main>
		<script src="../../static/js/validacao.js"></script>
	</body>
</html>
